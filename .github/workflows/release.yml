name: Release

# Build the platform-named static artifact and publish it to a GitHub Release
# whenever a v* tag is pushed. The only supported target is Ubuntu x64.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build release artifact (dist/srm-${VERSION}-ubuntu-x64 + .sha256)
        run: make release VERSION="$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "dist/srm-$VERSION-ubuntu-x64" \
            "dist/srm-$VERSION-ubuntu-x64.sha256" \
            --title "$VERSION" \
            --notes "Static linux/amd64 (Ubuntu x64) build. See CHANGELOG.md for details. Verify with the attached .sha256." \
            --verify-tag
