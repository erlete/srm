name: Release

# Build the platform-named static artifact and publish it to a GitHub Release
# whenever a v* tag is pushed. The only supported target is Ubuntu x64.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # SHA-pinned (see .github/workflows/ci.yml for the rationale).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # gh below authenticates via GH_TOKEN, not git

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifact (dist/srm-${VERSION}-ubuntu-x64 + .sha256)
        run: make release VERSION="$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "dist/srm-$VERSION-ubuntu-x64" \
            "dist/srm-$VERSION-ubuntu-x64.sha256" \
            --title "$VERSION" \
            --notes "Static linux/amd64 (Ubuntu x64) build. See CHANGELOG.md for details. Verify with the attached .sha256." \
            --verify-tag
