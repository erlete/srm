name: CI

on:
  push:
    branches: [stable, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build (linux/amd64 — the only supported target)
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build ./...

      - name: Test
        run: go test ./...
